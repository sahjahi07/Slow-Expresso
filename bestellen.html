<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slow Expresso| Bestellung</title>
    <link rel="stylesheet" href="bestllenstyle.css">

<body>

    <h1>Bestellen</h1>

<div class="bestellung">

<form action="https://blj-ict-bz.ch/formlog/" method="post"> 
    
<label for="name">Name*</label>
<input type="text" name="name" id="name-field" required>
<p>
<label for="nachname">Nachname*</label>
<input type="text" name="nachname" id="nachname" required>
<p>
<label for="Telefonummer">Telefonummer*</label>
<input type="text" name="Telefonummer" id="Telefonummer" required>
<p>
<label for="e-mail">E-mail</label>
<input type="text" name="e-mail" id="e-mail">
<p>
<h2>Deine Adresse</h2>
<label for="Strasse">Strasse*</label>
<input type="text" name="Strasse" id="Strasse" required>
<p>
<label for="Ort">PLZ, Ort*</label>
<input type="text" name="PLZ, Ort" id="PLZ, Ort" required>
<p>
<label for="Haus">Haus nr.*</label>
<input type="text" name="Haus nr." id="Haus nr." required>
<p>

<h2>Bestellung</h2>
<form action="https://blj-ict-bz.ch/formlog/" method="post">

  <div class="kaffee-dropdown">
   <p>Kaffe auswählen:*</p>

    <div id="kaffeeAuswahl" class="kaffee-auswahl">
      <div class="kaffee-zeile">
        <label>
          <input type="checkbox" name="kaffee[]" value="espresso">
          Espresso
        </label>
        <input type="number" name="menge_espresso" min="0" max="10" value="0" >
      </div>

      <div class="kaffee-zeile">
        <label>
          <input type="checkbox" name="kaffee[]" value="doppelterespresso">
          Doppelter Espresso
        </label>
        <input type="number" name="menge_doppelterespresso" min="0" max="10" value="0" >
      </div>

      <div class="kaffee-zeile">
        <label>
          <input type="checkbox" name="kaffee[]" value="espressomacchiato">
          Espresso Macchiato
        </label>
        <input type="number" name="menge_espressomacchiato" min="0" max="10" value="0" >
      </div>

      <div class="kaffee-zeile">
        <label>
          <input type="checkbox" name="kaffee[]" value="americano">
          Americano
        </label>
        <input type="number" name="menge_americano" min="0" max="10" value="0" >
      </div>

      <div class="kaffee-zeile">
        <label>
          <input type="checkbox" name="kaffee[]" value="cafecrema">
          Café Crema
        </label>
        <input type="number" name="menge_cafecrema" min="0" max="10" value="0" >
      </div>

      <div class="kaffee-zeile">
        <label>
          <input type="checkbox" name="kaffee[]" value="cappuccino">
          Cappuccino
        </label>
        <input type="number" name="menge_cappuccino" min="0" max="10" value="0" >
      </div>

      <div class="kaffee-zeile">
        <label>
          <input type="checkbox" name="kaffee[]" value="filterkaffee">
          Filterkaffee
        </label>
        <input type="number" name="menge_filterkaffee" min="0" max="10" value="0" >
      </div>

      <div class="kaffee-zeile">
        <label>
          <input type="checkbox" name="kaffee[]" value="caffelatte">
          Caffè Latte
        </label>
        <input type="number" name="menge_caffelatte" min="0" max="10" value="0" >
      </div>

      <div class="kaffee-zeile">
        <label>
          <input type="checkbox" name="kaffee[]" value="lattemacchiato">
          Latte Macchiato
        </label>
        <input type="number" name="menge_lattemacchiato" min="0" max="10" value="0">
      </div>

      <div class="kaffee-zeile">
        <label>
          <input type="checkbox" name="kaffee[]" value="flatwhite">
          Flat White
        </label>
        <input type="number" name="menge_flatwhite" min="0" max="10" value="0">
      </div>
    </div>
  </div>

 <h2>Zahlungsmittel auswählen*</h2>

<div class="Zahlungmöglichkeiten">

  <label class="Zalhungsmittel auswahl">
    <input type="radio" name="payment" value="twint">
    <span class="Zahlung box">
      <span>TWINT</span>
    </span>
  </label>

  <label class="Zalhungsmittel auswahl">
    <input type="radio" name="payment" value="paypal">
    <span class="Zahlung box">
      <span>PayPal</span>
    </span>
  </label>

  <label class="Zalhungsmittel auswahl">
    <input type="radio" name="payment" value="card">
    <span class="Zahlung box">
      <span>Kreditkarte</span>
    </span>
  </label>

  <label class="Zalhungsmittel auswahl"></label>
  
</div>
<p>
 <button type="submit">Bestellung abschicken </button>

</form>





<div class="knopf">
        <a href="index.html" class="knopf1">Startseite</a>
    </div>



</body>
</html>
